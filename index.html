function practiceStart(s,mapId,tier=0,wrong=false){if(s.raid||s.practice||!map(mapId)||![0,1,2,3].includes(tier))return false;let pool=D.quizzes[mapId].map((q,i)=>({q,i})).filter(x=>!tier||(x.q[3]||1)===tier);if(wrong)pool=pool.filter(x=>s.seen.includes(mapId+':'+x.i)&&!s.mastered.includes(mapId+':'+x.i));if(!pool.length)return false;let unseen=pool.filter(x=>!s.seen.includes(mapId+':'+x.i));if(unseen.length)pool=unseen;const {q,i}=pick(s,pool),answers=q[1].map((text,j)=>({text,correct:j===0}));for(let j=answers.length-1;j>0;j--){const k=Math.floor(random(s)*(j+1));[answers[j],answers[k]]=[answers[k],answers[j]];}s.practice={map:mapId,index:i,question:q[0],answers,explanation:q[2],tier:q[3]||1,topic:q[4]||map(mapId).subject,answered:false};return true;}

 s.hp=attr(s).hp;note(s,'录取通知书不在战利品池里。你带着一支铅笔进入大学。');return s;

function random(s){s.seed=(Math.imul(1664525,s.seed)+1013904223)>>>0;return s.seed/4294967296;}
function pick(s,a){return a[Math.floor(random(s)*a.length)];}
function note(s,t){s.log.unshift(t);s.log=s.log.slice(0,60);}
function attr(s){const a={power:8,guard:1,hp:100+Math.floor(s.stats.fitness/3),focus:65,insight:0,capacity:5};Object.values(s.gear).filter(Boolean).forEach(id=>Object.entries(item(id).stats).forEach(([k,v])=>a[k]+=v));for(const t of D.tech)Object.entries(t.stats).forEach(([k,v])=>a[k]+=v*rank(s,t.id));if(s.raid?.prep){a.power+=s.raid.prep.power;a.guard+=s.raid.prep.guard;}a.power+=Math.floor((s.stats.math+s.stats.stem)/7);a.guard+=Math.floor(s.stats.fitness/7);return a;}
function fix(s){const a=attr(s);s.hp=clamp(s.hp,0,a.hp);s.focus=clamp(s.focus,0,a.focus);s.stress=clamp(s.stress,0,100);}
function equip(s,id){if(s.raid||s.ending)return false;const x=item(id),i=s.stash.indexOf(id);if(!x||x.slot==='material'||i<0)return false;s.stash.splice(i,1);if(s.gear[x.slot])s.stash.push(s.gear[x.slot]);s.gear[x.slot]=id;fix(s);note(s,'装备了「'+x.name+'」。');return true;}
function salePrice(s,id){return Math.floor(item(id).value*(.65+rank(s,'merchant')*.02));}
function forgeCost(s){return 1800-rank(s,'craft')*100;}
function sell(s,id){if(s.raid||s.ending)return false;const i=s.stash.indexOf(id);if(i<0)return false;s.stash.splice(i,1);s.money+=salePrice(s,id);return true;}
function saleQuote(s,selection){if(s.raid||s.ending||!selection||typeof selection!=='object'||Array.isArray(selection))return null;const entries=Object.entries(selection);if(!entries.length)return null;let count=0,total=0;for(const [id,n] of entries){if(!item(id)||!Number.isSafeInteger(n)||n<=0||n>s.stash.filter(x=>x===id).length)return null;count+=n;total+=n*salePrice(s,id);}return {count,total};}
function sellBatch(s,selection){const quote=saleQuote(s,selection);if(!quote)return false;const remaining={...selection};s.stash=s.stash.filter(id=>{if(remaining[id]>0){remaining[id]--;return false;}return true;});s.money+=quote.total;note(s,'批量出售 '+quote.count+' 件仓库物资，经费 +'+quote.total+'。');return quote;}
function buy(s,id){if(s.raid||s.ending)return false;const cost={med:16,tonic:20,insurance:28}[id];if(!cost||s.money<cost||(id==='insurance'&&s.insurance))return false;s.money-=cost;if(id==='insurance')s.insurance=true;else s[id]++;return true;}
function project(s,id){if(s.raid||s.ending||s.projects.includes(id))return false;const p=D.projects.find(x=>x.id===id);if(!p||!Object.entries(p.cost).every(([k,n])=>s.stash.filter(x=>x===k).length>=n))return false;Object.entries(p.cost).forEach(([k,n])=>{for(let i=0;i<n;i++)s.stash.splice(s.stash.indexOf(k),1)});Object.entries(p.gain).forEach(([k,v])=>s.stats[k]+=v);s.money+=p.money;s.projects.push(id);note(s,'完成项目「'+p.name+'」：留下真实的学习成果。');return true;}
function rest(s){if(s.raid||s.ending)return false;s.hp=attr(s).hp;s.focus=attr(s).focus;s.stress=Math.max(0,s.stress-35);s.money+=22;note(s,'休整与勤工助学：恢复体力、专注，压力 −35，经费 +22。本周不出征。');advance(s);return true;}
function start(s,mapId,level){if(s.raid||s.ending||s.practice||s.week>32&&!s.freeplay||s.hp<=0||!map(mapId)||![1,2,3,4,5].includes(level)||s.money<difficulty(level).fee)return false;const m=map(mapId),d=difficulty(level);s.money-=d.fee;s.spent+=d.fee;s.raid={map:mapId,level,step:0,time:0,heat:0,bag:[],secure:null,phase:'route',choices:[],enemy:null,quiz:null,pending:null,event:null,bossWon:false,learned:0,prep:s.prep};s.prep=null;note(s,'进入 '+m.name+' · '+d.name+(d.fee?'，远征许可 −'+d.fee+' 经费':'')+'。背包里的收获还不属于你。');routes(s);return true;}

 const types=['search','study','fight','event','rest'];r.choices=[];for(let i=0;i<2;i++){let t=pick(s,types);while(r.choices.includes(t))t=pick(s,types);r.choices.push(t);}if(r.step>=4&&!r.bossWon)r.choices[1]='boss';
}
function drainLoot(s){const r=s.raid;while(r.lootQueue?.length){const id=r.lootQueue.shift();if(r.bag.length>=attr(s).capacity){r.pending=id;r.phase='loot';note(s,'背包满了！发现「'+item(id).name+'」，需要取舍。');return;}r.bag.push(id);note(s,'搜获「'+item(id).name+'」。');}r.pending=null;}

function secure(s,index){const r=s.raid;if(!r||!['route','loot'].includes(r.phase)||index<0||index>=r.bag.length)return false;const id=r.bag[index];if(r.secure)r.bag[index]=r.secure;else r.bag.splice(index,1);r.secure=id;note(s,'已将「'+item(id).name+'」收入保险格；失利也会保留。');return true;}
function discard(s,index){const r=s.raid;if(!r||r.phase!=='route'||index<0||index>=r.bag.length)return false;note(s,'放下了「'+item(r.bag.splice(index,1)[0]).name+'」。');return true;}
function move(s,type){const r=s.raid;if(!r||r.phase!=='route'||!r.choices.includes(type))return false;r.step++;r.time++;r.heat+=difficulty(r.level).heat;s.focus=Math.max(0,s.focus-3);s.stress+=2;

}
function enemy(s,boss=false,extract=false){const r=s.raid,m=map(r.map),d=difficulty(r.level);let hp=d.hp+(boss?24+r.level*4:0);r.enemy={name:extract?'撤离拦截 · 临时加题':boss?m.boss:m.enemy,hp,max:hp,attack:d.attack+(boss?3+r.level:0),turn:0,boss,extract,stagger:0};r.phase='combat';note(s,'遭遇 '+r.enemy.name+'。观察它下一回合的意图。');}
function quiz(s,kind){const r=s.raid,qs=D.quizzes[r.map],eligible=eligibleQuestions(r.map,r.level).filter(x=>!r.combo?.used.includes(x.i));const stageTier=r.combo?(r.combo.done===0?2:3):0,staged=eligible.filter(x=>(x.q[3]||1)===stageTier),pool=staged.length?staged:eligible;let candidates=pool.filter(x=>!s.seen.includes(r.map+':'+x.i));if(!candidates.length)candidates=pool;if(r.level>=4){const advanced=candidates.filter(x=>(x.q[3]||1)>=2);if(advanced.length&&random(s)<.8)candidates=advanced;}const index=pick(s,candidates).i,q=qs[index];if(r.combo)r.combo.used.push(index);const answers=q[1].map((text,i)=>({text,correct:i===0}));for(let i=answers.length-1;i>0;i--){const j=Math.floor(random(s)*(i+1));[answers[i],answers[j]]=[answers[j],answers[i]];}r.quiz={kind,index,question:q[0],answers,explanation:q[2],tier:q[3]||1,topic:q[4]||map(r.map).subject};r.phase='quiz';}
function answer(s,index){const r=s.raid;if(!r||r.phase!=='quiz'||!Number.isInteger(index)||index<0||index>2)return false;const q=r.quiz,key=r.map+':'+q.index,ok=q.answers[index].correct;

function continueFeedback(s){const r=s.raid;if(!r||r.phase!=='feedback')return false;const f=r.feedback;r.feedback=null;r.quiz=null;if(f.kind==='combat'&&f.comboContinues&&r.combo){quiz(s,'combat');return true;}r.combo=null;if(f.kind==='combat'){if(r.enemy.hp<=0)win(s);else{r.phase='combat';if(!f.ok&&r.level>=4){const extra=r.level===5?9:5;s.hp-=extra;note(s,'高阶盲区追问：额外体力 −'+extra+'。');if(s.hp<=0){finish(s,false,'盲区追问耗尽了你的体力。');return true;}}retaliate(s);}}else{if(f.ok)loot(s);if(s.raid&&r.phase!=='loot')routes(s);}return true;}
function isHeavy(s){const r=s.raid;return r.enemy.turn%(r.level===5?2:3)===(r.level===5?1:2);}
function retaliate(s,guard=false){const r=s.raid,e=r.enemy;if(e.stagger){e.stagger--;note(s,'对方被你的论据打断。');e.turn++;return;}const heavy=isHeavy(s);const damage=Math.max(1,e.attack+(heavy?9:0)-attr(s).guard-(guard?10:0));s.hp-=damage;s.stress+=heavy?4:2;e.turn++;note(s,(heavy?'追问重击':'对方反击')+'：体力 −'+damage+'。');fix(s);if(s.hp<=0)finish(s,false,'体力耗尽。室友来把你捞走了。');}

function win(s){const r=s.raid,e=r.enemy;note(s,'你解决了「'+e.name+'」。');s.stats[map(r.map).stat]+=e.boss?3:1;if(e.extract){finish(s,true,'最后一道问题解决。成功撤离！');return;}if(e.boss){r.bossWon=true;if(!s.bosses.includes(r.map))s.bosses.push(r.map);s.money+=25;note(s,'首领奖励：经费 +25，本次撤离不会再被拦截。');}loot(s,e.boss);if(r.phase!=='loot')routes(s);}
function use(s,type){if(s.ending||!['med','tonic'].includes(type)||s[type]<=0||s.raid&&!['route','combat','loot','event'].includes(s.raid.phase))return false;const a=attr(s);if(type==='med'&&s.hp>=a.hp||type==='tonic'&&s.focus>=a.focus)return false;s[type]--;if(type==='med')s.hp+=38;else s.focus+=30;fix(s);note(s,type==='med'?'热饭与休息：体力 +38。':'整理思路：专注 +30。');if(s.raid&&s.raid.phase==='combat')retaliate(s);return true;}

 fix(s);if(s.hp<=0)finish(s,false,'这一次，你确实需要休息了。');else{if(rewards.length)grantLoot(s,rewards);if(r.phase!=='loot')routes(s);}return true;

function extract(s){const r=s.raid;if(!r||r.phase!=='route')return false;if(!r.step){finish(s,true,'你判断准备不足，主动结束了本周探索。');return true;}const risk=extractionRisk(s);if(random(s)<risk){note(s,'撤离途中被临时加题拦截！');enemy(s,false,true);}else finish(s,true,'你赶上了末班校园巴士。成功撤离！');return true;}

 }

function inspect(id){inspectId=id;const x=E.item(id);if(!x)return;const owned=state&&state.stash.includes(id),equipped=state&&Object.values(state.gear).includes(id);open(`<div class="inspect-grid"><div><div class="inspect-art" id="inspect-art">${Art.svg(x,true)}</div><div class="sub" style="text-align:center">移动指针观察光影与造型</div></div><div class="inspect-info"><div class="eyebrow" style="color:${Art.colors[x.rarity]}">${rarityName(x)} · ${D.slots[x.slot]||'研究材料'}</div><h2>${x.name}</h2><div class="material">${x.material}</div><p class="lore">${x.lore}</p>${Object.entries(x.stats).map(([k,v])=>`<div class="effect"><span>${D.effects[k]}</span><b>+ ${v}</b></div>`).join('')||`<div class="sub">${[...D.projects.filter(p=>p.cost[id]).map(p=>'用于「'+p.name+'」'),...Object.entries(D.redRecipes).filter(([k,r])=>r[id]).map(([k])=>'用于修复「'+E.item(k).name+'」')].join('、')||'保存、收藏，或换取下一次远征的经费。'}</div>`}<div class="effect"><span>交换价值</span><b>${E.salePrice(state,x.id)} 经费</b></div><div class="inspect-actions row">${owned&&!state.raid&&!state.ending?`${x.slot!=='material'?btn('装备','equip',id,'primary'):''}${btn('交换一件','sell',id,'','',false)}`:equipped?'<span class="tag">已装备</span>':'<span class="sub">'+(state&&state.raid?'副本内只能管理战利品，撤离后可装备。':'在课程副本中探索获得。')+'</span>'}</div></div></div>`);

function home(){const s=state,a=E.attr(s),pr=E.admission(s),target=E.goalStatus(s,s.targetSchool||'mit');return head('宿舍里的作战桌','再大的理想，也从下一次认真出发开始。')+(s.last?`<div class="result"><div class="row spread"><h2>${s.last.success?'撤离成功':'这次，先回家'}</h2>${btn('收起','dismiss','','small ghost')}</div><p>${esc(s.last.text)} 带回 ${s.last.kept.length} 件，遗失 ${s.last.lost} 件。本次首次遇到的知识题 ${s.last.learned} 道。</p><div class="row">${s.last.kept.map(id=>btn(E.item(id).name,'inspect',id,'small')).join('')}</div></div>`:'')+`<div class="home-grid"><section class="panel lead-panel"><div class="eyebrow">YOUR NEXT EXPEDITION</div><h2>把今天的问题，<br>带到明天的答案里。</h2><p>已完成 ${s.extractions} 次撤离、${s.projects.length} 个研究项目。当前最适合「${pr.path}」方向；不同路线都能成长。</p><div class="row">${btn('选择副本 →','tab','maps','primary')}${btn('休整一周','rest','','ghost')}</div><p class="sub" style="margin-bottom:0">休整：恢复全部体力与专注，压力 −35，经费 +22；消耗一周。</p></section><section class="panel"><div class="row spread"><h2>能力档案</h2><span class="tag">大 ${Math.min(4,Math.floor((s.week-1)/8)+1)}</span></div>${stats()}<div class="section sub">论证 ${a.power} · 防御 ${a.guard} · 洞察 ${a.insight}<br>储物 ${s.stash.length} 件 · 研究成果 ${s.projects.length}/6</div></section></div><section class="section"><div class="row spread"><h2 class="section-title">随身装备 <span class="sub">/ 进入副本前配装</span></h2>${btn('整理仓库','tab','stash','small ghost')}</div><div class="equip-row">${Object.keys(D.slots).map(slot=>{const it=s.gear[slot]&&E.item(s.gear[slot]);return `<button class="equip-slot" data-action="${it?'inspect':'tab'}" data-arg="${it?it.id:'stash'}">${it?Art.svg(it):'<span class="muted" style="padding:15px">＋</span>'}<span><small>${D.slots[slot]}</small><div class="name">${it?it.name:'等待你的第一件藏品'}</div><small>${it?statText(it.stats):'从副本中搜集'}</small></span></button>`}).join('')}</div></section><div class="section home-grid"><section class="panel"><h2>校园手记</h2>${logs(5)}</section><section class="panel"><h2>申请路线 · 游戏内目标</h2><div class="sub">当前追踪：${target.goal.name}。需同时满足各条件；这是 function maps(){const rates=E.dropRates(state,level),boss=E.dropRates(state,level,true),d=E.difficulty(level);return head('越深处，越值得准备','五档难度均可选择。高阶远征收费，失败不退许可费；准备与退出由你决定。','EXPEDITIONS / 课程副本',`<div class="seg difficulty" role="group" aria-label="副本难度">${D.difficulties.map(x=>`<button data-action="level" data-arg="${x.id}" class="${level===x.id?'active':''}" aria-pressed="${level===x.id}">${x.id} · ${x.name}</button>`).join('')}</div>`)+`<section class="panel rate-panel"><div class="row spread"><h2>${d.name} · 敌人强度 ${d.hp} / 基础攻击 ${d.attack}</h2><span class="tag">远征许可 ${d.fee} 经费</span></div><p class="sub">${d.desc} 题库：${['','基础概念','基础＋应用','全部层次'][d.tier]}。普通探索与首领使用独立掉落表。${level>=4?'战斗洞察要求连续答对 '+(level===5?3:2)+' 题，零容错。':''}</p><div class="rate-grid">${rates.map((n,i)=>`<div><span style="color:${Art.colors[i]}">${D.rarities[i]}</span><b>${n.toFixed(2)}%</b><small>首领 ${boss[i].toFixed(2)}%</small></div>`).join('')}</div><p class="sub">概率包含已升级科技，不含尚未开始的远征简报。高阶首领保底：资格试炼/学术深渊连续 7 次未出红，第 8 次必出；当前 ${state.redDry}/7。每次先抽品质，再抽物品。抽到绯红时，两件炫彩各有 0.1% 条件概率；其余 99.8% 抽普通红色。其他品质在本地图对应池中等概率抽取；空池回退全局。</p><p class="prismatic-note">炫彩每件实际掉率：普通 ${ (rates[5]*.001).toFixed(5)}% · 首领 ${(boss[5]*.001).toFixed(5)}%（不含保底）。每件标价 50,000–60,000，经费交换价按当前估值科技计算。无炫彩保底、无法制作；红色保底触发时也只有每件 0.1% 的概率。</p></section>${state.practice?'<p class="notice">还有一道练习未结束，请到知识手账结束或暂时放下后再出征。</p>':''}<div class="map-grid section">${D.maps.map((m,i)=>`<article class="map-card"><div class="symbol">${m.icon}</div><div class="eyebrow">SECTOR 0${i+1} / ${m.subject}</div><h2>${m.name}</h2><p>${m.desc}</p><div class="sub">${D.quizzes[m.id].length} 道题 · 当前可抽 ${E.eligibleQuestions(m.id,level).length} 道<br>成长：${D.stats[m.stat]} · 首领：${m.boss.split(' · ')[1]}</div><div class="row spread">${btn(state.money<d.fee?'许可经费不足':'进入副本 →','start',m.id,'primary',state.money<d.fee||Boolean(state.practice)||Boolean(state.ending))}<span class="sub">${state.bosses.includes(m.id)?'✦ 已突破首领':'◇ 首领尚未突破'}</span></div></article>`).join('')}</div>`;}
function stash(gallery=false){const counts={};state.stash.forEach(id=>counts[id]=(counts[id]||0)+1);for(const id of Object.keys(saleSelection)){saleSelection[id]=Math.min(saleSelection[id],counts[id]||0);if(!saleSelection[id])delete saleSelection[id];}const arr=D.items.filter(x=>(gallery||counts[x.id])&&(filter==='all'||x.slot===filter)&&(!gallery||quality==='all'||quality==='prismatic'&&x.prismatic||quality==='red'&&x.rarity===5&&!x.prismatic||quality==='gold'&&x.rarity===4)).sort((a,b)=>Number(Boolean(b.prismatic))-Number(Boolean(a.prismatic))||b.rarity-a.rarity);const quote=E.saleQuote(state,saleSelection);

x.id}" aria-label="${x.name}出售数量" min="0" max="${counts[x.id]}" step="1" value="${saleSelection[x.id]||0}" ${state.ending?'disabled':''}></label><span class="sub">${E.salePrice(state,x.id)} / 件</span></div></div>`).join('')}</div>`:'<div class="empty">这里还空着。带着一件战利品平安回来，就很好。</div>'}`;}

function reviewSale(){const quote=E.saleQuote(state,saleSelection);if(!quote)return;pendingSale={...saleSelection};open(`<h2>出售 ${quote.count} 件物资？</h2><p>获得 <b class="gold">${quote.total} 经费</b>，按每件交换价计算。请核对材料和高品质藏品。</p><div class="sale-review">${Object.entries(pendingSale).map(([id,n])=>`<div class="row spread"><span style="color:${Art.colors[E.item(id).rarity]}">${E.item(id).name} × ${n}</span><span>+${n*E.salePrice(state,id)}</span></div>`).join('')}</div><div class="row section">${btn('确认出售 '+quote.count+' 件','bulk-confirm','','primary')}${btn('返回调整','close','','ghost')}</div>`,'BULK SALE / 批量出售');}

function shop(){return head('让经费成为下一次突破','补给、定向采购、远征简报、研讨与绯红修复。服务不占行动周。','SUPPLIES / 补给与工坊')+`<div class="shop-grid">${[['med','◒','热饭补给',16,'恢复 38 体力；战斗中使用会受到反击。',state.med],['tonic','◇','思路卡片',20,'恢复 30 专注；战斗中使用会受到反击。',state.tonic],['insurance','▣','同伴支援',28,'失利保留 '+Math.round(E.recoveryRate(state)*100)+'% 背包，向上取整；保险格另算。',state.insurance?1:0]].map(([id,ic,n,c,d,num])=>`<section class="panel"><div class="shop-symbol">${ic}</div><h2>${n}</h2><p class="sub">${d}</p><p class="gold">${c} 经费 <span class="sub">/ 持有 ${num}</span></p>${btn('购买','buy',id,'primary',state.money<c||id==='insurance'&&state.insurance)} ${id!=='insurance'?btn('使用','use',id,'',!num||(id==='med'?state.hp>=E.attr(state).hp:state.focus>=E.attr(state).focus)):''}</section>`).join('')}</div><div class="shop-grid section">${[['recover','恢复服务',65,'体力和专注回满、压力 −25。保住宝贵的行动周。'],['briefing','下次远征简报',90,'下一次出征：论证 +3，防御 +2；从低品质转移 4 个百分点至史诗/典藏。结算后失效。'],['training','专题研讨',120+state.services*60,'科研 +1，表达 +1；每参加一次，之后费用增加 60。']].map(([id,n,c,t])=>`<section class="panel"><h2>${n}</h2><p class="sub">${t}</p><p class="gold">${c} 经费</p>${btn(id==='briefing'&&state.prep?'简报已准备':'购买服务','service',id,'',state.money<c||id==='briefing'&&Boolean(state.prep)||id==='recover'&&state.hp>=E.attr(state).hp&&state.focus>=E.attr(state).focus&&state.stress===0)}</section>`).join('')}</div><section class="panel section"><h2>材料定向采购</h2><p class="sub">采购价为基础价值的 4 倍。能补齐配方，无法倒卖套利；绯红材料只能从副本获得。</p><div class="procurement">${D.items.filter(x=>x.slot==='material'&&x.rarity<5).map(x=>`<div class="row spread"><span>${x.name}</span>${btn(x.value*4+' 经费 · 采购','material',x.id,'small ghost',state.money<x.value*4)}</div>`).join('')}</div></section><section class="section"><h2 class="section-title">绯红传承修复工坊</h2><p class="sub">先解锁科技「传承修复工坊」。每次修复需要 ${E.forgeCost(state)} 经费及配方材料（已计科技减免），保留修复后的装备。</p><div class="project-grid">${Object.entries(D.redRecipes).map(([id,recipe])=>{const can=E.rank(state,'curator')&&state.money>=E.forgeCost(state)&&Object.entries(recipe).every(([k,n])=>state.stash.filter(x=>x===k).length>=n);return `<section class="panel"><div style="width:120px;margin:auto">${Art.svg(E.item(id))}</div><h2 style="color:${Art.colors[5]}">${E.item(id).name}</h2><div class="recipe">${Object.entries(recipe).map(([k,n])=>`<span>${E.item(k).name} ${state.stash.filter(x=>x===k).length}/${n}</span>`).join('')}</div>${btn(E.forgeCost(state)+' 经费 · 定向修复','forge',id,'primary',!can)}</section>`}).join('')}</div></section><div class="section panel"><h2>宿舍永远有一盏灯</h2><p class="sub">休整一周：恢复体力与专注，压力 −35，经费 +22。</p>${btn('休整一周','rest','','ghost')}</div>`;}
function journal(){const p=state.practice,records=state.journal.filter(q=>bookMap==='all'||q.key.startsWith(bookMap+':'));return head('把遇到的问题，变成能调用的知识','题库扩至 '+D.questionCount+' 道。练习室不消耗资源、不产出物品或能力；副本首次学习奖励独立计算。','NOTEBOOK / 知识与练习')+`<div class="row"><span class="tag">已见 ${state.journal.length} / ${D.questionCount}</span><span class="tag">答对过 ${state.mastered.length} / ${D.questionCount}</span></div><section class="panel section"><h2>自由练习室</h2><div class="row"><label class="sub">学科 <select id="study-map" aria-label="学科">${D.maps.map(m=>`<option value="${m.id}" ${studyMap===m.id?'selected':''}>${m.subject} · ${D.quizzes[m.id].length} 题</option>`).join('')}</select></label><label class="sub">层次 <select id="study-tier" aria-label="层次">${['全部层次','基础概念','应用理解','进阶辨析'].map((n,i)=>`<option value="${i}" ${studyTier===i?'selected':''}>${n}</option>`).join('')}</select></label><label class="sub"><input id="study-wrong" type="checkbox" ${studyWrong?'checked':''}> 只练尚未答对的错题</label>${btn('抽取一道题','practice','','primary',Boolean(p))}</div>${p?`<div class="section"><div class="eyebrow">${esc(p.topic)} / ${['','基础','应用','进阶'][p.tier]}</div><h2 style="margin-top:15px">${esc(p.question)}</h2>${p.answered?`<div class="feedback ${p.ok?'':'wrong'}"><b>${p.ok?'回答正确':'这道题值得再想一遍'}</b><p>正确答案：${esc(p.answers.find(x=>x.correct).text)}<br>${esc(p.explanation)}</p></div>${btn('结束本题','practice-close','','primary')}`:p.answers.map((x,i)=>`<button class="quiz-answer" data-action="practice-answer" data-arg="${i}"><span>${String.fromCharCode(65+i)}</span>${esc(x.text)}</button>`).join('')+btn('暂时放下','practice-close','','small ghost')}</div>`:'<p class="sub">优先抽取未见过的题；基础、应用、进阶各有独立内容。旧版知识记录继续保留。</p>'}</section><div class="row spread section"><h2 class="section-title">已记录的知识</h2><select id="book-map" aria-label="手账学科筛选"><option value="all">所有学科</option>${D.maps.map(m=>`<option value="${m.id}" ${bookMap===m.id?'selected':''}>${m.subject}</option>`).join('')}</select></div>${records.length?records.map(q=>`<details><summary>${esc(q.question)} ${state.mastered.includes(q.key)?'<span class="good"> ✓</span>':''}</summary><p><span class="gold">${esc(q.answer)}</span><br>${esc(q.explanation)}</p></details>`).join(''):'<div class="empty">这个分类还没有记录。试试自由练习，或进入副本。</div>'}`;}
function tech(){const total=D.tech.reduce((n,t)=>n+E.rank(state,t.id),0),maxTotal=D.tech.reduce((n,t)=>n+t.max,0);return head('把经费投入下一次远征','科技在副本之间永久保留；只能在基地升级，失利不回退。每次升级价格递增。','META PROGRESSION / 局外科技树',`<span class="tag">已投入 ${total} / ${maxTotal} 级 · 科技与服务累计支出 ${state.spent}</span>`)+`<p class="notice">三条路线各 12 节，共 36 个节点。原有科技保留，后续延伸八节。前置节点达到指定等级后解锁下一节点；升级不占行动周。满级后仍可购买服务、材料与高阶远征许可。新开整个大学存档才会重置科技。</p><div class="row filter">${['all','研究方法','远征保障','探索与发现'].map(b=>btn(b==='all'?'全部路线':b,'tech-branch',b,b===techBranch?'primary':'ghost')).join('')}</div><div class="tech-tree ${techBranch!=='all'?'single-branch':''}">${['研究方法','远征保障','探索与发现'].filter(b=>techBranch==='all'||techBranch===b).map((branch,i)=>`<section class="tech-branch"><div class="branch-head"><div class="eyebrow">BRANCH 0${i+1}</div><h2>${branch}</h2></div>${D.tech.filter(t=>t.branch===branch).map(t=>{const lv=E.rank(state,t.id),reason=E.techStatus(state,t.id),max=lv===t.max;return `<article class="tech-node ${lv?'invested':''} ${reason&&!max?'locked':''}"><div class="row spread"><h3>${t.name}</h3><span class="tag">${lv} / ${t.max}</span></div><div class="tech-pips">${Array.from({length:t.max},(_,j)=>`<i class="${j<lv?'on':''}"></i>`).join('')}</div><p>${t.effect}</p><div class="sub">${t.pre?'前置：'+D.tech.find(x=>x.id===t.pre[0]).name+' Lv.'+t.pre[1]:'起始节点 · 无前置'}</div><div class="section">${btn(max?'已满级':E.techCost(state,t.id)+' 经费 · 升级','upgrade',t.id,!reason?'primary':'ghost',Boolean(reason))}${reason&&!max?`<div class="sub" style="margin-top:6px">${reason}</div>`:''}</div></article>`}).join('')}</section>`).join('')}</div>`;}
const routeInfo={search:['搜寻资料','打开资料柜，寻找战利品。可能触发突击检查。'],study:['灯下自习','解一道知识题。答对获得物品与专注。'],fight:['直面难题','一场普通战斗。胜利带来属性与战利品。'],event:['校园奇遇','人物、意外与抉择。收益取决于你的选择。'],rest:['楼梯间歇脚','体力 +16，专注 +15，压力 −6。'],boss:['挑战课程首领','更强的对手；战利品更好，胜利保障本局撤离。']};
function raid(){const s=state,r=s.raid,m=E.map(r.map),a=E.attr(s),e=r.enemy;let scene='';
 if(r.phase==='route')scene=`<div class="eyebrow">FORK IN THE CORRIDOR / 岔路</div><h2>${r.step===0?'推开门，大学在里面。':r.time>=9?'远处传来了闭馆广播。':'前面又是两条路。'}</h2><p>${r.time>=9?'距离强制闭馆只剩 '+(12-r.time)+' 次探索推进。现在撤离仍有机会；继续探索到第 12 格会失去未保护战利品。':pickFlavor(r)}</p><div class="route-buttons">${r.choices.map((type,i)=>`<button class="route" data-action="move" data-arg="${type}"><span class="number">0${i+1} / ${type.toUpperCase()}</span><b>${routeInfo[type][0]}</b><small>${routeInfo[type][1]}</small></button>`).join('')}</div><div class="route-foot row spread"><div class="sub">撤离拦截概率 <span class="${E.extractionRisk(s)>.35?'bad':'good'}">${Math.round(E.extractionRisk(s)*100)}%</span><br>${r.bossWon?'首领已突破：本次安全撤离。':'拦截后可战斗，或损失最后一件背包物品脱身。'}</div>${btn('带着收获撤离 →','extract','','primary')}</div>`;
 if(r.phase==='combat')scene=`<div class="eyebrow">${e.boss?'BOSS ENCOUNTER':'ENCOUNTER'} / 问题来袭</div><h2>${esc(e.name)}</h2><div class="row spread sub"><span>问题强度</span><span>${Math.max(0,e.hp)} / ${e.max}</span></div><div class="enemybar"><i style="width:${Math.max(0,e.hp/e.max*100)}%"></i></div><div class="combat-banner">下回合意图：${e.stagger?'被打断，无法反击':E.isHeavy(s)?'追问重击（额外 +9 伤害，建议防守或洞察）':'常规质询'}<br>预计承伤 ${e.stagger?0:Math.max(1,e.attack+(E.isHeavy(s)?9:0)-a.guard)} · 防守可再减 10（最低 1）</div><div class="combat-actions">${btn('基础论证 · 免费','combat','attack')}${btn('集中论证 · 8 专注','combat','burst','',s.focus<8)}${btn((r.level>=4?(r.level===5?'3':'2')+' 连环洞察':'洞察破防')+' · '+E.quizCost(s)+' 专注','combat','quiz','primary',s.focus<E.quizCost(s))}${btn('防守反问 · 回 8 专注','combat','guard')}</div><div class="route-foot">${btn(e.extract?'弃物突围':'脱离纠缠','combat','flee','small ghost')} <span class="sub">体力 −${Math.max(2,e.attack-a.guard)}${e.extract?'，丢弃背包最后一件后撤离':'，警戒 +12'}</span></div>`;
 if(r.phase==='quiz')scene=`<div class="eyebrow">INSIGHT / ${r.quiz.kind==='combat'?'洞察破防':'自习时刻'} · ${['','基础','应用','进阶'][r.quiz.tier||1]} / ${esc(r.quiz.topic||m.subject)}</div>${r.combo?`<div class="combo-track">${Array.from({length:r.combo.total},(_,i)=>`<span class="${i<r.combo.done?'done':i===r.combo.done?'current':''}">${i+1} · ${i===0?'应用':i===1?'深入':'交叉质询'}</span>`).join('')}</div><p class="danger-text">连环组合第 ${r.combo.done+1} / ${r.combo.total} 题 · 容错 0 · 全对才造成伤害</p>`:''}<h2>${esc(r.quiz.question)}</h2><p>${r.quiz.kind==='combat'?(r.combo?'整组连续答对才攻击并打断；任一题错，本次无伤害且组合清零，承受反击与额外 '+(r.level===5?9:5)+' 点追问伤害。':'答对造成大量伤害并打断一次反击；答错承受反击。'):'第一次遇到本题：答对能力 +2，答错 +1。读懂解释也算收获。'}</p>${r.quiz.answers.map((x,i)=>`<button class="quiz-answer" data-action="answer" data-arg="${i}"><span>${String.fromCharCode(65+i)}</span>${esc(x.text)}</button>`).join('')}`;
 if(r.phase==='feedback')scene=`<div class="eyebrow">LEARNING IS LOOT / 知识已记入手账</div><h2>${r.feedback.ok?'这个问题，被你想清楚了。':'这页错题，也值得带走。'}</h2><div class="feedback ${r.feedback.ok?'':'wrong'}"><span class="${r.feedback.ok?'good':'gold'}">正确答案：${esc(r.feedback.answer)}</span><p>${esc(r.feedback.explanation)}</p></div>${r.combo?`<p class="notice">${r.feedback.comboContinues?'当前通过 '+r.combo.done+'/'+r.combo.total+'，伤害尚未结算。下一题继续质询。':r.feedback.ok?'整组通过，洞察伤害已生效。':'组合中断，本次没有洞察伤害。继续后结算敌方反击与高阶追问。'}</p>`:''}${btn(r.feedback.comboContinues?'进入下一题 →':'记下了，继续 →','continue','','primary')}`;
 if(r.phase==='event'){const ev={mentor:['导师办公室还亮着灯','你偶遇一位愿意听你提问的老师。你的笔记里恰好有一个具体问题。',['带着问题敲门｜专注 −10，科研 +2，获得 3 件物品','先休息再预约｜体力 +12，压力 −8']],group:['小组群里一片安静','作业还没动，截止日却从不等人。谁来组织下一步？',['明确分工与节点｜专注 −8，表达 +2，经费 +15，获得 2 件物品','自己全部接下｜压力 +8，经费 +25']],shortcut:['一扇没有锁的资料室','传说这里藏着上一届留下的材料。但巡查的脚步越来越近。',['进去看看｜获得 '+(r.level>=4?'4–6':'3–5')+' 件物品，警戒 +18','回到主路｜警戒 −12']],ethics:['“这几个点，删了就好看了”','拟合线很漂亮，可那几个异常点似乎也在讲故事。',['保留并解释｜科研 +2，获得 2 件物品（含阴性结果）','暂停提交，独立核查｜专注 +12，压力 −5']],rain:['突如其来的暴雨','备份硬盘还在对面的楼里。窗外，路灯照亮整片雨幕。',['冒雨取回｜体力 −12，专注 +20，存活获得 3 件物品','先在屋檐下整理｜体力 +10，警戒 −8']]}[r.event];scene=`<div class="eyebrow">CAMPUS ENCOUNTER / 校园奇遇</div><h2>${ev[0]}</h2><p>${ev[1]}</p>${ev[2].map((t,i)=>`<button class="quiz-answer" data-action="event" data-arg="${i}">${t}</button>`).join('')}<p class="sub">整批物品依次入包；装不下时逐件选择替换或放弃，不会自动折算经费。随机物品分别按当前难度的普通掉率抽取。</p>`;}
 if(r.phase==='loot'){const x=E.item(r.pending);scene=`<div class="eyebrow">MAKE ROOM / 背包已满</div><h2>没有一件收获，是免费的。</h2><div style="max-width:190px;margin:auto">${itemCard(x.id)}</div><p>发现「${x.name}」。本批还有 ${(r.lootQueue||[]).length} 件等待整理。点击替换或放弃，之后继续处理下一件。</p><div class="row">${r.bag.length<a.capacity?btn('收入空出的背包格','replace',-2,'primary'):''}${r.bag.map((id,i)=>btn('换掉 '+E.item(id).name,'replace',i,'small')).join('')}${btn('留给后来的人','replace',-1,'ghost')}</div>`;}

function render(){if(!state){app.innerHTML=`<div class="shell">${welcome()}<div class="footer">BEFORE THE PHD / 上岸之前<span>一款关于好奇心、取舍与成长的文字搜打撤</span></div></div>`;return;}const s=state,a=E.attr(s);if(s.raid)tab='raid';if(s.ending&&['home','maps','projects','shop','raid'].includes(tab))tab='ending';const tabs=[['home','⌂','宿舍基地'],['maps','◇','课程副本'],['stash','▣','物资仓库'],['projects','⌬','研究工作台'],['tech','⌘','局外科技树'],['goals','↗','申请目标'],['shop','＋','补给与工坊'],['journal','≡','知识手账'],['gallery','✧','藏品图鉴']];app.innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">岸</div><div><strong>上岸之前</strong><div class="eyebrow">BEFORE THE PHD / 搜 · 打 · 撤</div></div></div><div class="top-info"><div class="sub">${s.freeplay?'自由研修':s.ending?'旅程完成':'第 '+Math.min(8,Math.floor((s.week-1)/4)+1)+' 学期'}<b>${s.freeplay?'研修第 '+(s.week-32)+' 周':s.ending?'申请季终章':'第 '+((s.week-1)%4+1)+' / 4 周'}</b></div><div class="sub">研究经费<b>◈ ${s.money}</b></div><div class="sub save-indicator">${saveOK?'● 已自动存档':'○ 自动存档不可用'}<br>${btn('导出备份','export','','small ghost')}</div></div></header><div class="layout"><aside class="sidebar">${tabs.map(([id,icon,n])=>`<button class="nav ${tab===id?'active':''}" data-action="tab" data-arg="${id}" ${s.raid?'disabled':''}><span>${icon}</span><span>${n}</span></button>`).join('')}${s.raid?'<div class="tag">副本进行中 · 撤离后开放基地</div>':''}<div class="aside-note">${s.raid?'勇敢地往前走，<br>也聪明地回头。':'不必把每一次探索，<br>都变成对自己的审判。'}<br><br>${s.freeplay?'无周数上限 · 保留原结局':(32-Math.min(32,s.week-1))+' 个行动周剩余'}</div><div class="utility row">${btn('玩法','help','','small ghost')}${btn('存档','save-menu','','small ghost')}</div></aside><main>${s.ending?'':`<div class="vitals">${vital('体力',s.hp,a.hp,'')}${vital('专注',s.focus,a.focus,'focus')}${vital('压力',s.stress,100,'stress')}</div>`}${({home,maps,stash,projects,tech,goals,shop,journal,gallery:()=>stash(true),raid,ending}[tab]||home)()}</main></div><footer class="footer"><span>知识不是唯一的战利品。能继续保持好奇，也很好。</span><span>离线单机 · 原创矢量物品 · v2.2 满载与远志</span></footer></div>`;}
function help(){open(`<h2>V2.2 · 满载与远志</h2><p class="muted">84 件藏品（含 30 金、30 红、2 炫彩）、260 道知识题、五档难度、三分支三十六节点科技树。旧存档自动迁移，原题目的编号不变。</p><details open><summary>新版成长与绯红掉落</summary><p>五档难度的普通绯红基础掉率依次为 0%、0.2%、1%、3%、6%；首领为 1%、2%、6%、12%、20%。进入地图前可查看完整概率表，科技效果实时计入。资格试炼/学术深渊首领连续 7 次未出红，下次必出；普通掉红不重置这个首领保底。</p><p>科技树前置按节点等级解锁。检索术与远征简报从低品质转移概率至史诗/典藏，绯红辨识额外提高红色概率。红色材料可以修复红色装备。定向采购只售非红材料，采购价高于转卖价。</p><p>资格试炼许可 45，经费不足不能进入；学术深渊许可 85。资格试炼须连续答对 2 题、学术深渊须连续答对 3 题，整组成功才造成伤害；任一题错会清零组合并承受反击。高难度敌人更强、警戒更快；洞察答错分别额外扣 5/9 体力，深渊每两次敌方反击一次重击。所有难度可自由选择，无隐藏解锁门槛。</p></details><details><summary>题库与毕业后研修</summary><p>每张地图现有 36–38 道题，分基础、应用、进阶。预习只抽基础，进阶抽基础与应用，深研及以上覆盖全部；最高两档优先选应用/进阶未见题。练习室可指定学科和层次，也可只练尚未答对的错题。练习不刷经费或属性，不占周数，也不抢占以后副本的首次学习奖励。</p><p>原申请季仍在 32 周后结算。结局页可选择“保留一切，继续自由研修”，保存原结局并解除周数上限，继续探索科技和绯红收藏。</p></details><h2>第一次玩：这样开始</h2><ol><li>进入「课程副本」，推荐先选预习难度。</li><li>岔路中搜物资、答知识题或战斗；看好体力和闭馆倒计时。</li><li>获得珍贵物品后，在岔路点击背包中的「保」放入保险格。</li><li>随时在岔路撤离。成功才把背包入库；失利仍保留学习成长与保险格物品。</li><li>回宿舍装备工具、补充热饭，再用材料完成研究项目。</li></ol><details open><summary>时间、风险与战斗</summary><p>8 学期 × 4 行动周，共 32 周。每次出征结算或休整消耗一周，配装、购买、项目不耗周。探索房间推进一格，战斗回合和答题不推进格数。推进到第 12 格会强制失利。副本没有现实时间倒计时，可以慢慢读题。</p><p>每次探索增加警戒，压力也提高撤离拦截概率。拦截概率会在岔路明示，最高 72%；击败本局首领后为 0。前四档每三次敌人反击中的第三次是重击；深渊每两次的第二次为重击，防守与洞察尤其有用。洞察答对造成大额伤害并打断一次攻击；同一知识题首次遇见才加学习属性。所有错题都有解释。</p></details><details><summary>装备、背包与保险</summary><p>工具、随身物、背包各装备一件，可自由换装。论证增加伤害；防御减少承伤；洞察提高答题攻击；体能也提高体力上限与防御。基础背包 5 格，帆布包再加 2 格，远征包再加 5 格。保险格是额外 1 格。背包满时可以替换已有物品。</p><p>同伴支援消耗 28 经费，只保下一次出征。失败保留基础 50% 背包（回收科技每级再加 10 个百分点，向上取整），保险格物品独立保留；成功也会消耗支援。失败扣 12 经费，体力至少恢复到 35，再获得回营恢复。主动撤离时若被拦截，可以付出体力并弃掉背包最后一件物品突围。首领胜利当场给 25 经费，其他战利品仍需带回。</p></details><details><summary>如何到达名校结局</summary><p>六个研究项目各只能完成一次，消耗配方材料、增加能力并发放经费。32 周后自动结算。申请目标共有七层：成长分 100、180、300、440、560、640、720。MIT 目标要求 720 分、全部 6 个项目、英语 55、科研 110；每层还需满足申请目标页列出的对应能力条件。成长分取三个研究方向的加权能力最高值，再加每个项目 12 分和每张已突破首领地图 3 分，最终四舍五入。</p><p>理论：1.2×数学＋专业＋1.4×科研＋0.7×英语＋0.4×表达。实验：1.2×专业＋1.5×科研＋0.6×数学＋0.7×英语＋0.5×表达。交叉：1.2×表达＋英语＋1.3×科研＋0.5×专业＋0.5×数学。</p><p>自由研修每隔 8 个行动周可再次申请；旧结局保留在档案，新一轮按当前最高达标层次结算。所有结局都会保留旅程。此处是虚构的游戏规则，不能用来预测实际录取。</p></details><details><summary>存档与知识说明</summary><p>每次操作后自动保存到本浏览器本地存储；部分浏览器对本地文件的存储有限制，建议定期导出 JSON 存档。导出可备份或跨设备导入，刷新可以继续副本。新开一局会替换当前存档，游戏会再次询问。</p><p>题目用于基础概念学习，解释经过内容核对但不是课程教材、医疗建议或现实申请指南。游戏无网络请求、账号或付费功能。知识手账可回看已遇到的题目。</p></details>`,`FIELD GUIDE / 校园远征指南`);}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)dispatch(b.dataset.action,b.dataset.arg);});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
function prepareImport(data){try{const incoming=E.migrate(data);if(!valid(incoming))throw Error('schema');open(`<h2>导入第 ${incoming.week} 周的旅程？</h2><p class="muted">${data.version===1?'这是 V1 存档，将自动迁移并保留原始副本。':'这是 V2 存档。'} 当前进度会先保存在导入前备份，再替换为选中的存档。</p><div class="row">${btn('先导出当前进度','export','','ghost')}<button class="btn primary" id="confirm-import">确认导入</button>${btn('取消','close','','ghost')}</div>`,'IMPORT / 存档导入');$('confirm-import').onclick=()=>{try{if(state)localStorage.setItem(SAVE+'-before-import',JSON.stringify(state));if(data.version===1)localStorage.setItem(SAVE+'-backup-v1',JSON.stringify(data));}catch{toast('浏览器备份不可用，请保留原 JSON 文件。');}state=incoming;saleSelection={};pendingSale=null;loadIssue=false;tab='home';save();modal.close();render();toast('旅程已恢复，旧物品与知识记录保留。');};}catch{toast('无法读取该存档：格式不兼容或数据不完整，当前进度未改动。');}}
function exportLegacy(){let raw;try{raw=localStorage.getItem(SAVE+'-backup-v1');}catch{}if(!raw){toast('当前浏览器没有升级前备份。');return;}const a=document.createElement('a'),url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.href=url;a.download='上岸之前_V1原始存档备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);if($('save-text'))$('save-text').value=raw;}
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>2e6){toast('存档文件过大。');return;}try{prepareImport(JSON.parse(await file.text()));}catch{toast('文件不是有效的 JSON 存档。');}});
document.addEventListener('change',e=>{if(e.target.dataset.saleCheck||e.target.dataset.saleQuantity){const id=e.target.dataset.saleCheck||e.target.dataset.saleQuantity,have=state.stash.filter(x=>x===id).length,n=e.target.dataset.saleCheck?(e.target.checked?have:0):Math.min(have,Math.max(0,Math.floor(Number(e.target.value)||0)));if(n)saleSelection[id]=n;else delete saleSelection[id];render();return;}if(e.target.id==='gallery-quality'){quality=e.target.value;render();return;}if(e.target.id==='sale-rarity'){if(e.target.value!==''){selectBulk(e.target.value);render();}return;}if(e.target.id==='study-map')studyMap=e.target.value;else if(e.target.id==='study-tier')studyTier=Number(e.target.value);else if(e.target.id==='study-wrong')studyWrong=e.target.checked;else if(e.target.id==='book-map')bookMap=e.target.value;else return;render();});

render();if(migrated)toast('已升级 V2：原始存档已备份，进度完整保留。');
})();

</script>
</body></html>
